<!doctype html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register · Expenso</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head><body>
<div class="auth-wrap"><div class="auth-card">
  <div class="brand"><span class="logo">₹</span> Expenso</div>
  <h2>Create account</h2>
  <p class="auth-sub">Start tracking your money in minutes</p>
  <form id="registerForm" novalidate>
    <div class="field"><label>Full name</label><input type="text" name="name" placeholder="Jane Doe" autocomplete="name"></div>
    <div class="field"><label>Email</label><input type="email" name="email" placeholder="you@example.com" autocomplete="email"></div>
    <div class="field"><label>Password</label><input type="password" name="password" placeholder="At least 6 characters" autocomplete="new-password"></div>
    <div class="err-text" id="err"></div>
    <button class="btn primary" style="width:100%" type="submit" id="submitBtn">Create account</button>
  </form>
  <p class="auth-alt">Already have an account? <a href="login.html">Sign in</a></p>
</div></div>
<div class="toasts" id="toasts"></div>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/register.js"></script>
</body></html>
